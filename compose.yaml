services:
  web:
    build: ./app
    restart: unless-stopped
    env_file: ./deploy/app.env
    environment:
      DATABASE_URL: file:/data/kaoyan.db
      UPLOAD_ROOT: /data/uploads
      MISTAKE_SKILL_DATA_ROOT: /data/mistake-skill
      MISTAKE_SKILL_DIR: /app/vendor/mistake-learning
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

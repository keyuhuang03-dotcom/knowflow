name: KnowFlow CI

on:
  pull_request:
    branches: [main, develop/competition]
  push:
    branches: [main, develop/competition]

permissions:
  contents: read

jobs:
  checks:
    name: Web and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      DEEPSEEK_API_KEY: ""
      MISTAKE_AI_API_KEY: ""
      MISTAKE_AI_MODEL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Set up isolated data
        run: |
          mkdir -p "$RUNNER_TEMP/knowflow-uploads"
          printf 'DATABASE_URL=file:%s/knowflow-ci.db\nUPLOAD_ROOT=%s/knowflow-uploads\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:bootstrap
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --webpack
